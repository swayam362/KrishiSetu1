<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Account — KrushiSetu</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body style="background: radial-gradient(circle at center, #e8f9ee 0%, #f1f5f9 100%); min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Header -->
  <header style="padding: 1.25rem 0; border-bottom: 1px solid rgba(226, 232, 240, 0.8); background: rgba(255, 255, 255, 0.9);">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">🌾</div>
        <div>
          <span>KrushiSetu</span>
          <span class="brand-tagline-sub">Smart Farming Ecosystem</span>
        </div>
      </a>
      <a href="login.html" class="btn btn-outline btn-sm">Already have an account? Sign In</a>
    </div>
  </header>

  <!-- Registration Form Container -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2.5rem 1rem;">
    <div class="card" style="max-width: 580px; width: 100%; padding: 2.25rem; border-radius: var(--radius-xl); box-shadow: var(--shadow-xl); background: var(--white);">
      
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <span style="font-size: 2.5rem; display: inline-block; margin-bottom: 0.25rem;">🌱</span>
        <h1 style="font-size: 1.75rem; color: var(--slate-900);">Create KrushiSetu Account</h1>
        <p style="color: var(--slate-500); font-size: 0.9rem;">Join the direct agricultural trading and intelligence network</p>
      </div>

      <!-- Error Message Box -->
      <div id="reg-error-box" style="display: none; background: #fee2e2; border-left: 4px solid var(--danger); color: #991b1b; padding: 0.75rem 1rem; border-radius: var(--radius-sm); font-size: 0.88rem; margin-bottom: 1.25rem;">
      </div>

      <!-- Role Selection Toggle -->
      <div style="display: flex; gap: 0.5rem; background: var(--slate-100); padding: 0.35rem; border-radius: var(--radius-md); margin-bottom: 1.5rem;">
        <button type="button" class="btn btn-primary role-select-btn active" data-role="farmer" style="flex: 1; font-size: 0.88rem; padding: 0.5rem;">
          👨‍🌾 I am a Farmer
        </button>
        <button type="button" class="btn btn-outline role-select-btn" data-role="buyer" style="flex: 1; font-size: 0.88rem; padding: 0.5rem;">
          🏢 I am a Bulk Buyer / Mill
        </button>
      </div>

      <form id="register-form">
        <input type="hidden" id="selected-role" value="farmer" />

        <div class="form-group">
          <label class="form-label" for="fullName">Full Name *</label>
          <input type="text" id="fullName" class="form-control" placeholder="e.g. Ramesh Patil" required />
        </div>

        <!-- Buyer-only Business Name Field -->
        <div class="form-group buyer-only-field" style="display: none;">
          <label class="form-label" for="businessName">Company / Business Name *</label>
          <input type="text" id="businessName" class="form-control" placeholder="e.g. AgroFresh Processing Mills Pvt Ltd" />
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="regEmail">Email Address *</label>
            <input type="email" id="regEmail" class="form-control" placeholder="farmer@krushisetu.com" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="regPhone">Mobile Number (10 Digits) *</label>
            <input type="tel" id="regPhone" class="form-control" placeholder="9876543210" pattern="[0-9]{10}" required />
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="regState">State *</label>
            <input type="text" id="regState" class="form-control" placeholder="e.g. Maharashtra" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="regDistrict">District *</label>
            <input type="text" id="regDistrict" class="form-control" placeholder="e.g. Nashik" required />
          </div>
        </div>

        <!-- Farmer-only Location Field -->
        <div class="form-group farmer-only-field">
          <label class="form-label" for="regVillage">Village / Town *</label>
          <input type="text" id="regVillage" class="form-control" placeholder="e.g. Ozar Village" />
        </div>

        <!-- Farmer-only Land and Crops Fields -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;" class="farmer-only-field">
          <div class="form-group">
            <label class="form-label" for="farmSize">Farm Size (Acres)</label>
            <input type="text" id="farmSize" class="form-control" placeholder="e.g. 10.5" />
          </div>
          <div class="form-group">
            <label class="form-label" for="primaryCrops">Primary Crops</label>
            <input type="text" id="primaryCrops" class="form-control" placeholder="e.g. Wheat, Onion" />
          </div>
        </div>

        <!-- Buyer-only Location and GSTIN Fields -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; display: none;" class="buyer-only-field">
          <div class="form-group">
            <label class="form-label" for="regCity">City / Hub *</label>
            <input type="text" id="regCity" class="form-control" placeholder="e.g. Pune City" />
          </div>
          <div class="form-group">
            <label class="form-label" for="gstin">GSTIN / Tax ID (Optional)</label>
            <input type="text" id="gstin" class="form-control" placeholder="27AAAAA0000A1Z5" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Set Password (Min. 6 Characters) *</label>
          <input type="password" id="regPassword" class="form-control" placeholder="Choose a strong password" minlength="6" required />
        </div>

        <button type="submit" id="register-submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
          Complete Registration →
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.88rem; color: var(--slate-600); border-top: 1px solid var(--slate-100); padding-top: 1.25rem;">
        Already have an account? <a href="login.html" style="font-weight: 700; color: var(--primary-700);">Sign In here</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
