<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — KrushiSetu</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body style="background: radial-gradient(circle at center, #e8f9ee 0%, #f1f5f9 100%); min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Simple Header -->
  <header style="padding: 1.25rem 0; border-bottom: 1px solid rgba(226, 232, 240, 0.8); background: rgba(255, 255, 255, 0.9);">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">🌾</div>
        <div>
          <span>KrushiSetu</span>
          <span class="brand-tagline-sub">Smart Farming Ecosystem</span>
        </div>
      </a>
      <a href="register.html" class="btn btn-outline btn-sm">Create New Account</a>
    </div>
  </header>

  <!-- Login Card Container -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2.5rem 1rem;">
    <div class="card" style="max-width: 440px; width: 100%; padding: 2.25rem; border-radius: var(--radius-xl); box-shadow: var(--shadow-xl); background: var(--white);">
      
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <span style="font-size: 2.5rem; display: inline-block; margin-bottom: 0.25rem;">🔐</span>
        <h1 style="font-size: 1.75rem; color: var(--slate-900);">Sign In to KrushiSetu</h1>
        <p style="color: var(--slate-500); font-size: 0.9rem;">Access your authenticated portal and smart tools</p>
      </div>

      <!-- Error Message Box -->
      <div id="login-error-box" style="display: none; background: #fee2e2; border-left: 4px solid var(--danger); color: #991b1b; padding: 0.75rem 1rem; border-radius: var(--radius-sm); font-size: 0.88rem; margin-bottom: 1.25rem;">
      </div>

      <!-- Role Selector Toggle -->
      <div style="display: flex; gap: 0.35rem; background: var(--slate-100); padding: 0.35rem; border-radius: var(--radius-md); margin-bottom: 1.5rem;">
        <button type="button" class="btn btn-primary role-select-btn active" data-role="farmer" style="flex: 1; font-size: 0.82rem; padding: 0.5rem 0.25rem;">
          👨‍🌾 Farmer
        </button>
        <button type="button" class="btn btn-outline role-select-btn" data-role="buyer" style="flex: 1; font-size: 0.82rem; padding: 0.5rem 0.25rem;">
          🏢 Bulk Buyer
        </button>
        <button type="button" class="btn btn-outline role-select-btn" data-role="admin" style="flex: 1; font-size: 0.82rem; padding: 0.5rem 0.25rem;">
          👑 Admin
        </button>
      </div>

      <form id="login-form">
        <input type="hidden" id="selected-role" value="farmer" />

        <div class="form-group">
          <label class="form-label" for="email">Mobile Number or Email</label>
          <input type="text" id="email" class="form-control" placeholder="e.g. 9876543210 or farmer@krushisetu.com" required />
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
            <a href="#" style="font-size: 0.8rem; color: var(--primary-700);" onclick="showToast('Password reset link sent to mobile/email.', 'info')">Forgot?</a>
          </div>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required />
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
          Sign In to Dashboard →
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.88rem; color: var(--slate-600); border-top: 1px solid var(--slate-100); padding-top: 1.25rem;">
        New to KrushiSetu? <a href="register.html" style="font-weight: 700; color: var(--primary-700);">Register here</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
